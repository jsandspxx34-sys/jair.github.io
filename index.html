<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Purple Lightning Shop</title> 
    <link rel="stylesheet" href="style.css"> 
</head> 
<body> 
    <div class="bg"></div> 
    <nav> 
        <h1 class="logo">PURPLE LIGHTNING</h1> 
        <ul> 
            <li><a href="#shop">Shop</a></li> 
            <li><a href="#donate">Donate</a></li> 
            <li><a href="#discord">Discord</a></li> 
        </ul> 
    </nav> 
    <section id="shop"> 
        <h2>Shop</h2> 
        <div class="card"> 
            <h3>Example Product</h3> 
            <p>$5.00</p> 
            <a class="button" href="https://www.paypal.com">Buy Now</a> 
        </div> 
    </section> 
    <section id="donate"> 
        <h2>Donations</h2> 
        <p>Support us ❤️</p> 
        <a class="button" href="https://ko-fi.com">Donate</a> 
    </section> 
    <section id="discord"> 
        <h2>Discord Login</h2> 
        <p>Connect to Discord</p> 
        <a class="button" href="https://discord.com/oauth2/authorize">Login with Discord</a> 
    </section> 
<script src="script.js"></script> 
</body> 
</html>
